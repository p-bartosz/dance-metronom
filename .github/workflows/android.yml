name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk dance-metronom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dance-metronom-apk
          path: dance-metronom.apk

      # Stały adres do pobrania na telefonie: Releases → „latest” → dance-metronom.apk
      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Najnowsza wersja" --notes "APK budowany automatycznie z gałęzi main."
          gh release upload latest dance-metronom.apk --clobber
          gh release edit latest --notes "APK z commita ${GITHUB_SHA::7}, build ${GITHUB_RUN_NUMBER}."
